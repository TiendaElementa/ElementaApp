<!DOCTYPE html>

<title>App Elementa - Redirigiendo</title>
<style>

</style>
<script>
  const target = new URL('https://appelementa.firebaseapp.com/');

  target.hash = window.location.hash;
  window.location.replace(target.toString());
</script>
</head>
